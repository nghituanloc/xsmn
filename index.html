<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
  <title>KQXS Miền Nam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#b71c1c">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      Thiết bị đang chặn JavaScript nên không thể tải kết quả. Vui lòng bật JavaScript hoặc tắt chặn script, rồi tải lại trang.
    </div>
  </noscript>

  <div id="app" class="wrap">
    <div id="messageBanner" class="message-banner" hidden role="alert" aria-live="polite"></div>

    <nav class="date-nav control-area" aria-label="Chọn ngày xem kết quả">
      <div class="date-nav-row">
        <button id="btnPrev" type="button" class="btn-nav">Ngày trước</button>
        <button id="btnNext" type="button" class="btn-nav">Ngày sau</button>
      </div>
      <div class="date-shortcuts">
        <button id="btnYesterday" type="button" class="btn-shortcut">Hôm qua</button>
        <button id="btnToday" type="button" class="btn-shortcut">Hôm nay</button>
        <button id="btnPickDate" type="button" class="btn-shortcut" aria-expanded="false" aria-controls="datePickerWrap">Chọn ngày</button>
      </div>
      <div id="datePickerWrap" class="date-picker-wrap" hidden>
        <label for="date" class="date-picker-label">Chọn ngày xem kết quả</label>
        <input id="date" type="date" class="date-input"/>
      </div>
    </nav>

    <main id="panels" class="panels" aria-label="Danh sách kết quả theo ngày"></main>

    <div id="scratch" aria-hidden="true"></div>
  </div>

  <button id="btnTop" type="button" class="scroll-top" aria-label="Lên đầu trang">Lên đầu</button>
  <div id="pullIndicator" class="pull-indicator">Làm mới</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
